name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Cancel superseded runs for the same PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run lint

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run types

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run fmt:check

  test:
    runs-on: ubuntu-latest
    # The same database as compose.test.yaml; vitest.config.mts points at it.
    # Needs no secrets, so it also runs for pull requests from forks.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: echonic
          POSTGRES_PASSWORD: echonic
          POSTGRES_DB: echonic_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U echonic -d echonic_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      # Vitest runs on Node; Bun only installs the dependencies and runs the script.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    # Needs the R2 test bucket, and GitHub gives no secrets to pull requests from forks,
    # so those skip this job instead of failing it. Building the app is part of it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      R2_ACCOUNT_ID: ${{ secrets.E2E_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.E2E_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.E2E_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.E2E_R2_BUCKET_NAME }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: echonic
          POSTGRES_PASSWORD: echonic
          POSTGRES_DB: echonic_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U echonic -d echonic_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
